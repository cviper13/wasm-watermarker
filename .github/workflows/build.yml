name: Automated Windows Compiler

on:
  push:
    branches: [ "main", "master", "new" ] # Added 'new' since your logs show you are on branch 'new'
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false # Skip Git's broken submodule tracking

    - name: Setup MSYS2 Environment
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-boost
          git

    - name: Manually Clone Binaryen Repository
      run: |
        rm -rf binaryen
        git clone https://github.com/WebAssembly/binaryen.git binaryen

    - name: Compile Statically Linked Binaryen
      run: |
        cd binaryen
        mkdir -p build && cd build
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_STATIC_LIB=ON ..
        cmake --build .

    - name: Build Final Watermarker Executables
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .
        mkdir -p build/binaryen/build/lib
        cp binaryen/build/lib/libbinaryen.a build/binaryen/build/lib/
        cmake --build build

    - name: Save Executables as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: game-patch-watermarker-tools
        path: build/bin/*.exe