name: Automated Windows Compiler

on:
  push:
    branches: [ "main", "master", "new" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup MSYS2 Environment
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-boost
          git

    - name: Configure CMake Project
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .

    - name: Build External Dependencies First
      run: |
        # Force compilation of the external project targets
        cmake --build build --target binaryen
        cmake --build build --target fmt

    - name: Fix Layout Paths For Ninja
      run: |
        # Ensure target destination directories exist inside the build folder
        mkdir -p build/binaryen/build/lib
        mkdir -p build/fmt/build

        # Copy the libraries from your custom redirected folder (build/lib) 
        # to the specific sub-folders the internal scripts are searching for
        cp build/lib/libbinaryen.a build/binaryen/build/lib/ 2>/dev/null || cp build/binaryen/build/lib/libbinaryen.a build/binaryen/build/lib/ || true
        cp build/lib/libfmt.a build/fmt/build/ 2>/dev/null || cp build/fmt/build/libfmt.a build/fmt/build/ || true

    - name: Build Final Watermarker Executables
      run: |
        # Execute the main compilation step now that files match expectation
        cmake --build build

    - name: Save Executables as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: game-patch-watermarker-tools
        path: build/bin/*.exe