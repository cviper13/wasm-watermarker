name: Supercharged Cross-Compiler (Linux to Windows)

on:
  push:
    branches: [ "main", "master", "new" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/mingw-toolchain.cmake

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Install Toolchain and Cross Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build mingw-w64 libboost-dev git
        
        # FIX: Move Boost headers into the MinGW isolated environment.
        # This prevents CMake from accidentally adding -I/usr/include (Linux host headers)
        sudo cp -r /usr/include/boost /usr/x86_64-w64-mingw32/include/

    - name: Patch Upstream Dependency References
      run: |
        # Upstream fmtlib retired the 'master' branch name.
        if [ -f cmake/fmt.cmake ]; then
          sed -i 's/master/main/g' cmake/fmt.cmake
        fi

    - name: Create Windows Cross-Compile Toolchain File
      run: |
        cat << 'EOF' > ${{ github.workspace }}/mingw-toolchain.cmake
        set(CMAKE_SYSTEM_NAME Windows)
        set(CMAKE_SYSTEM_PROCESSOR x86_64)

        # Target compilers
        set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
        set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
        set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)

        # FIX: Lock down the search paths strictly to MinGW
        set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)

        # Adjust search behaviors to ONLY look inside the target root, NEVER the Linux host
        set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
        EOF

    - name: Configure CMake Project
      run: |
        # Clear out previous configuration cache
        rm -rf build
        
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release .

    - name: Build External Dependencies First
      run: |
        cmake --build build --target binaryen
        cmake --build build --target fmt

    - name: Fix Layout Paths For Ninja
      run: |
        mkdir -p build/binaryen/build/lib
        mkdir -p build/fmt/build

        # Safely mirror static libraries where the final targets expect them
        [ -f build/lib/libbinaryen.a ] && cp build/lib/libbinaryen.a build/binaryen/build/lib/ || true
        [ -f build/lib/libfmt.a ] && cp build/lib/libfmt.a build/fmt/build/ || true

    - name: Build Final Watermarker Executables
      run: |
        cmake --build build

    - name: Save Executables as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: game-patch-watermarker-tools-windows
        path: build/bin/*.exe